<title>Snake</title>
<style>

  html,body{margin:0;height:100%;background:var(--body);overflow:hidden;touch-action:none;
    font-family:"Courier New",monospace;color:var(--ink)}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
  .phone{background:#3d4f3d;border-radius:22px;padding:14px;box-shadow:0 8px 24px #0008, inset 0 0 0 2px #4d614d}
  .screen{background:var(--lcd);border:4px solid #1c2b1a;border-radius:6px;padding:6px;
    box-shadow:inset 0 0 12px #0004}
  .hud{display:flex;justify-content:space-between;font-weight:bold;font-size:15px;
    letter-spacing:1px;padding:0 2px 4px;text-transform:uppercase}
  .bar{height:6px;margin:0 2px 4px;border:1px solid var(--ink);visibility:hidden}
  .bar i{display:block;height:100%;background:var(--ink);width:100%}
  canvas{display:block;background:var(--lcd);border:2px solid var(--ink)}
  .pad{display:grid;grid-template-columns:80px 198px 80px;align-items:start;justify-content:center;width:100%}
  .pad button{border:0;font-family:inherit;color:#c5d9ac;padding:0}
  /* 3D D-pad: one raised plus-shaped piece, centred under the screen */
  .dpad{position:relative;width:198px;height:198px;filter:drop-shadow(0 7px 6px rgba(0,0,0,.55))}
  .dpad svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .dpad button{position:absolute;width:66px;height:66px;background:transparent;font-size:22px;color:#aab8a2;
    text-shadow:0 -1px 0 #000,0 1px 0 rgba(255,255,255,.18)}
  .dpad .up{left:66px;top:0;border-radius:10px 10px 0 0}
  .dpad .left{left:0;top:66px;border-radius:10px 0 0 10px}
  .dpad .right{left:132px;top:66px;border-radius:0 10px 10px 0}
  .dpad .down{left:66px;top:132px;border-radius:0 0 10px 10px}
  .dpad button:active{background:radial-gradient(circle at 50% 40%,rgba(0,0,0,.42),rgba(0,0,0,.12));box-shadow:inset 0 3px 6px rgba(0,0,0,.55)}
  .dpad button:active{transform:translateY(1px)}
  /* actions kept apart from the cross */
  .padL,.padR{height:198px;display:flex;flex-direction:column;align-items:center}
  .padL{justify-content:flex-start}.padR{justify-content:space-between}
  .padL button,.padR button{background:#4d614d;box-shadow:0 3px 0 #1c2b1a}
  .padL button:active,.padR button:active{transform:translateY(3px);box-shadow:none;background:#5f785f}
  .pause{width:72px;height:34px;border-radius:999px;font-size:11px;letter-spacing:.5px;font-weight:bold}
  .ok{width:64px;height:64px;border-radius:50%;font-size:17px;font-weight:bold}
  .mute{width:52px;height:34px;border-radius:999px;font-size:17px}
  @media (hover:hover) and (pointer:fine){.pad{display:none}}
  [hidden]{display:none!important}
  .tools{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
  .tbtn{background:#4d614d;color:#c5d9ac;border:0;border-radius:999px;padding:8px 14px;font:bold 13px "Courier New",monospace;
    box-shadow:0 2px 0 #1c2b1a;letter-spacing:.5px}
  .tbtn:active{transform:translateY(2px);box-shadow:none}
  #swatches{display:flex;gap:8px}
  /* retro mode: toggle + model on the left edge, colours on the right edge, over the phone's shell margins */
  body.retro .tools{display:contents}
  body.retro #retroBtn,body.retro #modelBtn,body.retro #installBtn,body.retro #shareBtn{position:fixed;left:max(5px,env(safe-area-inset-left,0px));z-index:6;width:44px;height:44px;padding:0;border-radius:50%;
    font-size:9px;line-height:1.15;letter-spacing:0;text-align:center;opacity:.92}
  body.retro #retroBtn{top:56%}
  body.retro #modelBtn{top:calc(56% + 52px)}
  body.retro #installBtn{top:calc(56% + 104px)}
  body.retro #shareBtn{top:calc(56% + 156px)}
  #tip{position:fixed;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:30;background:#1c2b1a;color:#d5e8bd;border:2px solid #5f785f;
    border-radius:14px;padding:12px 14px;font:bold 13px/1.4 "Courier New",monospace;text-align:center;box-shadow:0 6px 18px #000a}
  body.retro #swatches{position:fixed;right:max(7px,env(safe-area-inset-right,0px));top:calc(56% - 8px);z-index:6;flex-direction:column;gap:9px}
  .sw{width:26px;height:26px;border-radius:50%;border:2px solid #0006;padding:0;background:var(--sw);
    box-shadow:inset 0 3px 4px #fff5, inset 0 -3px 4px #0005}
  .sw[aria-pressed="true"]{outline:3px solid #e8f2d8;outline-offset:2px}
  .nkwrap{position:relative;flex:none}
  .nk{position:absolute;left:0;top:0;width:300px;transform-origin:0 0;filter:drop-shadow(0 16px 18px rgba(0,0,0,.6))}
  .nk img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none;}

  .plate{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none;

  }
  // ----- Snake II dot-matrix rendering -----

    const g = gapPx(); ctx.fillRect(x * dp, y * dp, dp - g, dp - g);
  }
  function text5(str, x, y) {
    for (const ch of str) {
      const gl = FONT[ch] || FONT[' '];
      for (let r = 0; r < 7; r++) for (let c = 0; c < 5; c++) if (gl[r][c] === '1') dot(x + c, y + r);
      x += 6;
    }
  }
  function text3(str, x, y) {                        // small 3x5 digits for the score
    for (const ch of str) { const gl = FONT3[ch]; for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++) if (gl[r][c] === '1') dot(x + c, y + r); x += 4; }
  }
  const cx5 = (str) => Math.floor((DW - (str.length * 6 - 1)) / 2);
  function tile(rows, ox, oy) { rows.forEach((r, ry) => { for (let c = 0; c < r.length; c++) if (r[c] === '#') dot(ox + c, oy + ry); }); }
  const T_WALL = ['#####', '#####', '#####', '#####'], T_FOOD = ['.##.', '#..#', '#..#', '.##.'];
  const MOUSE = ['#..#..', '#.####', '.#####', '..#.#.'];                // a little mouse (6x4 dots): curly tail, ear, snout; facing right
  function mouseTile(face, step) {
    const rows = MOUSE.slice(); if (step) rows[3] = '.#..#.';              // the feet scurry

  }
  const T_HEAD = {right: ['.##.', '##.#', '####', '.##.'], left: ['.##.', '#.##', '####', '.##.'], up: ['.##.', '#..#', '####', '.##.'], down: ['.##.', '####', '#..#', '.##.']};
  const T_OPEN = {right: ['.##.', '##.#', '##..', '.##.'], left: ['.##.', '#.##', '..##', '.##.'], up: ['#..#', '#..#', '####', '.##.'], down: ['.##.', '####', '#..#', '#..#']};
  function mouthOpen() {                            // food (or the bonus critter) within two cells ahead, or just eaten
    if (mouthTicks > 0) return true;
    const [dx, dy] = DIRS[dir];
    for (let st = 1; st <= 2; st++) {
      const x = (snake[0].x + dx * st + COLS) % COLS, y = (snake[0].y + dy * st + ROWS) % ROWS;
      if ((food && food.x === x && food.y === y) || (bonus && bonus.x === x && bonus.y === y)) return true;
    }
    return false;
  }
  const T_BLOB = ['.##.', '####', '####', '.##.'];
  const T_FOOD1 = ['....', '.##.', '.##.', '....'];
  let snakeCv = null, wallCv = null, wallDots = null;
  function buildWallDots() {                        // the maze as thin lines (2 dots) through the centres of the wall cells
    wallCv = wallCv || document.createElement('canvas'); wallCv.width = DW; wallCv.height = DH;
    const c = wallCv.getContext('2d', {willReadFrequently: true});
    c.clearRect(0, 0, DW, DH); c.fillStyle = c.strokeStyle = '#000'; c.lineWidth = 2; c.lineCap = 'butt';
    const cx = (i) => GX + i * CW + 2, cy = (j) => GY + j * CH + 2;
    for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
      if (!walls[j][i]) continue;
      c.fillRect(cx(i) - 1, cy(j) - 1, 2, 2);
      for (const [di, dj] of [[1, 0], [0, 1], [1, 1], [-1, 1]]) {
        const a = i + di, b = j + dj;
        if (!(a >= 0 && a < COLS && b < ROWS && walls[b][a])) continue;
        if (di !== 0 && dj !== 0 && (walls[j][a] || walls[b][i])) continue;      // a diagonal only where no straight link exists, so junctions stay 2 dots thick
        if (di < 0) { const main = (x, y) => !!((walls[y + 1] && walls[y + 1][x + 1]) || (walls[y - 1] && walls[y - 1][x - 1])); if (main(i, j) || main(a, b)) continue; }   // no cross-links between parallel diagonals
        c.beginPath(); c.moveTo(cx(i), cy(j)); c.lineTo(cx(a), cy(b)); c.stroke();
      }
    }
    const px = c.getImageData(0, 0, DW, DH).data; wallDots = [];
    for (let y = 0; y < DH; y++) for (let x = 0; x < DW; x++) if (px[(y * DW + x) * 4 + 3] > 120) wallDots.push([x, y]);
  }
  function drawSnake() {
    // body = a 2-dot-thick path through the cell centres. Snake II: round joins + a blank dot every few pixels (stitched look).
    // Snake I: one solid, fully connected chain with square corners.
    const round = game === 2, [sx, sy] = deathShift;
    snakeCv = snakeCv || document.createElement('canvas'); snakeCv.width = DW; snakeCv.height = DH;
    const c = snakeCv.getContext('2d', {willReadFrequently: true});
    c.clearRect(0, 0, DW, DH); c.strokeStyle = c.fillStyle = '#000'; c.lineWidth = 2;
    c.lineJoin = round ? 'round' : 'miter'; c.lineCap = round ? 'round' : 'square';
    const pt = (q) => [GX + q.x * CW + 2 + sx, GY + q.y * CH + 2 + sy];
    const flush = (run) => {
      if (run.length === 1) { c.beginPath(); if (round) c.arc(run[0][0], run[0][1], 1, 0, 6.2832); else c.rect(run[0][0] - 1, run[0][1] - 1, 2, 2); c.fill(); return; }
      c.beginPath(); c.moveTo(run[0][0], run[0][1]);
      if (round) for (let i = 1; i < run.length - 1; i++) c.quadraticCurveTo(run[i][0], run[i][1], (run[i][0] + run[i + 1][0]) / 2, (run[i][1] + run[i + 1][1]) / 2);   // curve through every turn
      else for (let i = 1; i < run.length - 1; i++) c.lineTo(run[i][0], run[i][1]);
      c.lineTo(run[run.length - 1][0], run[run.length - 1][1]); c.stroke();
    };
    let run = [pt(snake[0])];
    for (let i = 1; i < snake.length; i++) {
      const wrapped = Math.abs(snake[i].x - snake[i - 1].x) > 1 || Math.abs(snake[i].y - snake[i - 1].y) > 1;   // crossed a screen edge
      if (wrapped) { flush(run); run = []; }
      run.push(pt(snake[i]));
    }
    flush(run);
    const px = c.getImageData(0, 0, DW, DH).data, hx = GX + snake[0].x * CW + sx, hy = GY + snake[0].y * CH + sy;
    for (let y = 0; y < DH; y++) for (let x = 0; x < DW; x++) {
      if (round && x >= hx && x < hx + CW && y >= hy && y < hy + CH) continue;       // the head tile owns its own cell, so the eye and mouth stay open
      if (px[(y * DW + x) * 4 + 3] > 120 && (!round || (x + y) % 3 !== 2)) dot(x, y);
    }
    bulges.forEach(b => { if (b > 0 && b < snake.length) tile(T_BLOB, GX + snake[b].x * CW + sx, GY + snake[b].y * CH + sy); });   // swallowed food shows as a swelling
    if (round) tile((mouthOpen() ? T_OPEN : T_HEAD)[dir], hx, hy);
  }
  function frame(x0, y0, x1, y1) { for (let x = x0; x <= x1; x++) { dot(x, y0); dot(x, y1); } for (let y = y0; y <= y1; y++) { dot(x0, y); dot(x1, y); } }
  let splashBits = null;
  function splashDots() {                           // the title art, decoded once: [width, height, bit array]
    if (splashBits) return splashBits;
    const [w, h, b64] = SPLASH.split(','), bin = atob(b64), bits = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) bits[i] = (bin.charCodeAt(i >> 3) >> (7 - (i & 7))) & 1;

  }
  const ANT6 = ['#...#', '##.##', '.###.', '..#..', '..#..', '..#..'];
  const BAT7 = ['..#..', '#####', '#...#', '#...#', '#...#', '#...#', '#####'];
  const MW = [2, 3, 4, 5];                           // 4 bars max; each one a little wider than the one below
  function drawMeters() {                           // reception (left) and battery (right): long bars up the side, icon about 3/4 of the way down. Menu screens only.
    const N = MW.length, ls = segs(sigLevel, N), rs = segs(batLevel, N), segH = 11, bottom = Math.round(DH * 0.75) - 3;
    tile(ANT6, 1, Math.round(DH * 0.75)); tile(BAT7, DW - 6, Math.round(DH * 0.75));
    for (let b = 0; b < N; b++) {
      const yb = bottom - b * (segH + 1);
      for (let y = yb - segH + 1; y <= yb; y++) {
        dot(1, y); dot(DW - 2, y);                                 // a thin spine keeps every bar running the full length
        if (b < ls) for (let i = 1; i < MW[b]; i++) dot(1 + i, y);            // lit width = signal strength
        if (b < rs) for (let i = 1; i < MW[b]; i++) dot(DW - 2 - i, y);       // lit width = battery level
      }
    }
  }
  function drawG2() {
    ctx.clearRect(0, 0, cv.width, cv.height); ctx.fillStyle = INK;
    if (state === 'splash' || state === 'title') drawMeters();   // the meters belong to the menu screens; they disappear once the game starts
    if (state === 'splash') {
      const [aw, ah, bits] = splashDots();                         // the art is a finer LCD dot grid (about 3/4 of the game's dot size)
      const pitch = Math.max(2, Math.round(dp * 0.72)), ds = pitch - Math.max(1, Math.round(pitch * 0.14));
      const x0 = Math.round((cv.width - aw * pitch) / 2), y0 = Math.round(8 * dp);
      for (let j = 0; j < ah; j++) for (let i = 0; i < aw; i++) if (bits[j * aw + i]) ctx.fillRect(x0 + i * pitch, y0 + j * pitch, ds, ds);
      const pr = retro ? 'PRESS SELECT' : 'PRESS OK'; if (blink) text5(pr, cx5(pr), 60);
      return;
    }
    if (state === 'title') {
      const ttl = game === 2 ? 'SNAKE II' : 'SNAKE'; text5(ttl, cx5(ttl), 2); for (let x = 22; x < 82; x++) dot(x, 11);
      const mark = (r) => (row === r ? '>' : ' ');
      const line = (r, y, label, val) => { text5(mark(r) + ' ' + label, 11, y); text5('<', 57, y); text5(val, 71 - Math.floor((val.length * 6 - 1) / 2), y); text5('>', 85, y); };
      if (game === 2) { line(0, 15, 'GAME', 'II'); line(1, 25, 'LEVEL', String(level)); line(2, 35, 'SPEED', String(speed)); line(3, 45, 'WALLS', edge[game] ? 'ON' : 'OFF'); }
      else { line(0, 20, 'GAME', 'I'); line(2, 31, 'SPEED', String(speed)); line(3, 42, 'WALLS', edge[game] ? 'ON' : 'OFF'); }
      const hs = 'HI ' + pad4(curHi()); text5(hs, cx5(hs), 56);
      return;
    }
    const fx0 = GX - 2, fx1 = GX + COLS * CW, mid = DW >> 1;               // the box runs edge to edge
    text3(pad4(score), fx0 + 2, 2);                                                                 // score: top-left
    if (game === 2) { tile(mouseTile(true, false), fx1 - 15, 2); text3(String(Math.min(mice, 99)).padStart(2, '0'), fx1 - 8, 2); }   // mice collected: top-right
    if (bonus) { const w = Math.round(14 * Math.max(0, bonusLeft) / BONUS_MS); frame(mid - 9, 2, mid + 8, 6); for (let x = 0; x < w; x++) for (let y = 3; y <= 5; y++) dot(mid - 7 + x, y); }
    frame(fx0, 8, fx1, 67);                                          // the box; the cells sit 1 dot inside it
    const ox = (x) => GX + x * CW, oy = (y) => GY + y * CH;
    if (!wallDots) buildWallDots();
    for (const [wx, wy] of wallDots) dot(wx, wy);                                   // maze walls: 2 dots thick at most
    if (game === 2) {
      tile(T_FOOD, ox(food.x), oy(food.y));
      if (bonus && (blink || bonusLeft >= 2000)) tile(mouseTile(mouseFace, blink), Math.max(GX, Math.min(ox(bonus.x), GX + COLS * CW - 6)), oy(bonus.y));   // keep the wider sprite inside the border

    } else {                                                          // Snake I: one continuous chain

    }

      const px0 = (DW - 64) >> 1; ctx.clearRect(px0 * dp, 21 * dp, 64 * dp, 36 * dp); ctx.fillStyle = INK; frame(px0, 21, px0 + 63, 56);
      if (state === 'pause') { text5('PAUSED', cx5('PAUSED'), retro ? 30 : 35); if (retro) text5('C=MENU', cx5('C=MENU'), 40); }
      else {
        const g2 = game === 2, t = 'SCORE ' + pad4(score);
        text5('GAME OVER', cx5('GAME OVER'), g2 ? 24 : 27); text5(t, cx5(t), g2 ? 33 : 37);
        if (g2) { const m = 'MICE ' + mice; text5(m, cx5(m), 42); }

  }

    const pl = state === 'pause' ? '▶ RESUME' : '❚❚ PAUSE'; if (pauseBtn.textContent !== pl) pauseBtn.textContent = pl;
    if (dots()) return drawG2();
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = GHOST;
    for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) ctx.fillRect(x*cell + cell/2 - 1, y*cell + cell/2 - 1, 1, 1);

    if (state === 'title') {
      text(game === 2 ? 'SNAKE II' : 'SNAKE', cell*2.9, cell*2.2);
      for (let i = 0; i < 7; i++) block(7 + i, 4);
      const mark = (r) => (row === r ? '\u25B8' : ' ');
      let y = 6.8;
      text(`${mark(0)} GAME   \u25C2 ${game === 2 ? 'II' : 'I '} \u25B8`, cell*y, cell*1.1); y += 1.5;
      if (game === 2) { text(`${mark(1)} LEVEL  \u25C2 ${level} \u25B8`, cell*y, cell*1.1); y += 1.5; }
      text(`${mark(2)} SPEED  \u25C2 ${speed} \u25B8`, cell*y, cell*1.1); y += 1.5;
      text(`${mark(3)} WALLS  \u25C2 ${edge[game] ? 'ON ' : 'OFF'} \u25B8`, cell*y, cell*1.1);

      panel(6); text('GAME OVER', cell*6.6, cell*1.6); text('SCORE ' + pad4(score), cell*8.2, cell*1.1);

})();
</script>
<script>
// Offline support: save the game on the player's device (only where service workers exist; harmless elsewhere).
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener('load', () => { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} });
}
</script>
<div id="tip" hidden role="status"></div>
<script>
// Install + Share buttons (the browser's own Share / Add to Home Screen buttons are easy to miss).
(() => {
  const installBtn = document.getElementById('installBtn'), shareBtn = document.getElementById('shareBtn'), tip = document.getElementById('tip');
  let installEv = null, tipTimer = 0;
  const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  const showTip = (msg) => { tip.textContent = msg; tip.hidden = false; clearTimeout(tipTimer); tipTimer = setTimeout(() => { tip.hidden = true; }, 9000); };
  tip.addEventListener('click', () => { tip.hidden = true; });
  const sync = () => { installBtn.hidden = standalone() || !/^https?:$/.test(location.protocol); };
  sync(); addEventListener('appinstalled', () => { installBtn.hidden = true; });
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEv = e; });
  installBtn.addEventListener('click', async () => {
    if (installEv) { try { installEv.prompt(); await installEv.userChoice; } catch (e) {} installEv = null; return; }
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    showTip(ios
      ? 'On iPhone: tap the Share button (a square with an arrow pointing up) in Safari, scroll down the list and choose Add to Home Screen.'
      : 'Open your browser menu (three dots) and choose Install app or Add to Home screen.');
  });
  shareBtn.addEventListener('click', async () => {
    const data = {title: 'Retro Snake', text: 'Play Snake on a retro phone', url: location.href.split('#')[0]};
    try { if (navigator.share) { await navigator.share(data); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(data.url); showTip('Link copied. Paste it into a message to share the game.'); }
    catch (e) { showTip('Share this link: ' + data.url); }
  });
})();
</script>
